<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A2945">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kompass">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Auftragskompass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: dunkle Kopfleiste, darunter ein Board im Stil von MeisterTask.
   Eine Spalte pro fester Kunde, eine für Sonstige Projekte. Oben die Hochrechnung. */
:root {
  --bg: #EDF1F6;
  --surface: #FFFFFF;
  --col: #E1E7EF;
  --fg: #16233A;
  --muted: #5A6A82;
  --line: #D3DBE6;
  --accent: #1F7AE0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6F0FD;
  --nav: #1A2945;
  --nav-fg: #F2F6FC;
  --nav-muted: #A6B5CE;
  --good: #168A5B;
  --good-soft: #DDF3E8;
  --warn: #B86A12;
  --warn-soft: #FBEBD6;
  --shadow: 0 1px 2px rgba(22, 35, 58, .10), 0 0 0 1px rgba(22, 35, 58, .04);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1624; --surface: #1B2639; --col: #151F31; --fg: #E5EBF5; --muted: #93A2BA;
    --line: #2B3A54; --accent: #4D9CF6; --accent-ink: #08111F; --accent-soft: #1D3250;
    --nav: #0A111E; --nav-fg: #EEF3FB; --nav-muted: #8FA0BB;
    --good: #3CC48D; --good-soft: #14392C; --warn: #EBA252; --warn-soft: #3C2B14;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .04);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1624; --surface: #1B2639; --col: #151F31; --fg: #E5EBF5; --muted: #93A2BA;
  --line: #2B3A54; --accent: #4D9CF6; --accent-ink: #08111F; --accent-soft: #1D3250;
  --nav: #0A111E; --nav-fg: #EEF3FB; --nav-muted: #8FA0BB;
  --good: #3CC48D; --good-soft: #14392C; --warn: #EBA252; --warn-soft: #3C2B14;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .04);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  margin: 0; min-height: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Kopfleiste */
.top { background: var(--nav); color: var(--nav-fg); padding-block: 12px; padding-inline: 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top-in { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; margin-right: auto; display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.seg { display: inline-flex; background: rgba(255,255,255,.10); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--nav-muted); padding: 6px 16px; border-radius: 6px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); }
.sync { font-size: 12px; color: var(--nav-muted); min-width: 0; }
.top-rest { font-weight: 600; font-size: 13px; background: rgba(255,255,255,.12); border-radius: 99px; padding: 4px 12px; white-space: nowrap; }
.top-rest.ok { color: #7BE0B0; }
.top-rest:empty { display: none; }
.ghost { border: 1px solid rgba(255,255,255,.22); background: transparent; color: var(--nav-fg); border-radius: 8px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.ghost:hover { background: rgba(255,255,255,.10); }

.wrap { max-width: 1400px; margin: 0 auto; padding-block: 20px 56px; padding-inline: 16px; display: flex; flex-direction: column; gap: 18px; }

/* Zeitraum */
.period { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.period h1 { font-family: var(--font-display); font-size: 24px; margin: 0; letter-spacing: -.01em; font-weight: 700; }
.period .range { color: var(--muted); }
.period .nav { margin-left: auto; display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-shadow: var(--shadow); }
.btn:hover { border-color: var(--accent); }
.btn.sq { width: 36px; padding: 6px 0; }

/* Hochrechnung */
.hero { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px 32px; }
.eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.big { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 7vw, 52px); line-height: 1.05; letter-spacing: -.02em; }
.big.ok { color: var(--good); }
.bar { height: 10px; background: var(--col); border-radius: 99px; overflow: hidden; margin: 14px 0 8px; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.bar.ok span { background: var(--good); }
.sub { margin: 0; color: var(--muted); font-size: 13.5px; }
.sub + .sub { margin-top: 2px; }
.needs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.need { background: var(--bg); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; min-width: 0; }
.need b { font-family: var(--font-display); font-size: 30px; line-height: 1.05; font-weight: 700; }
.need .nm { font-weight: 600; overflow-wrap: anywhere; }
.need small { color: var(--muted); }
.covered { margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--good-soft); color: var(--good); font-weight: 600; }
.hint { background: var(--warn-soft); color: var(--fg); border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.hint p { margin: 0; flex: 1 1 260px; }

/* Board */
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; align-items: start; }
.cols { display: contents; }
.col { --c: #6B7A90; --ink: #FFFFFF; background: var(--col); background: color-mix(in srgb, var(--c) 13%, var(--col)); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col-h { display: flex; align-items: center; gap: 8px; background: var(--c); color: var(--ink); border-radius: 8px; padding: 9px 12px; }
.col-h h2 { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; margin-right: 6px; }
.count { margin-left: auto; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--ink) 20%, transparent); color: var(--ink); border-radius: 99px; padding: 1px 9px; }
.col-sum { margin: -4px 0 0; font-size: 13px; color: var(--muted); }
.add { border: 2px solid var(--c); border-radius: 9px; background: var(--surface); color: var(--fg); padding: 9px 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.add:hover { background: var(--c); color: var(--ink); }
.cl-name { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 10px; font-size: 16px; min-width: 0; width: 100%; }
.add:active { transform: translateY(1px); }
.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border-radius: 9px; box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card-top { display: flex; align-items: flex-start; gap: 8px; }
.cname { flex: 1 1 auto; min-width: 0; border: 0; border-bottom: 1px dashed var(--line); background: transparent; font-weight: 600; padding: 2px 0; border-radius: 0; }
.cname::placeholder { color: var(--muted); font-weight: 400; }
.amt { margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 18px; white-space: nowrap; }
.x { border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; flex: none; }
.x:hover { background: var(--bg); color: var(--fg); }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.empty { margin: 0; padding: 14px 10px; text-align: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 9px; }

.cname-btn { flex: 1 1 auto; min-width: 0; text-align: left; border: 0; background: transparent; font-weight: 600; padding: 2px 6px; margin-left: -6px; border-radius: 6px; overflow-wrap: anywhere; color: var(--fg); }
.cname-btn:hover, .datebtn:hover { background: var(--bg); }
.datebtn { position: relative; display: inline-flex; align-items: center; padding: 3px 6px; margin-left: -6px; border-radius: 6px; cursor: pointer; }
.date-hid { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }

/* Formular Sonstige */
.free-form { display: flex; flex-direction: column; gap: 8px; background: var(--surface); padding: 10px; border-radius: 9px; box-shadow: var(--shadow); }
.field { display: flex; flex-direction: column; gap: 3px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 8px 10px; min-width: 0; width: 100%; font-size: 16px; }
.preview { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.4em; }
.preview b { color: var(--fg); }

/* Einstellungen */
.panel { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-size: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.suffix { position: relative; }
.suffix input { padding-right: 34px; text-align: right; }
.suffix::after { content: attr(data-s); position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.clients { display: flex; flex-direction: column; gap: 10px; }
.crow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto auto; gap: 10px; align-items: end; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; padding-bottom: 9px; white-space: nowrap; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.danger { color: var(--warn); }

.swatches { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--fg); }

.sync-box { display: flex; flex-direction: column; gap: 10px; }

/* Hinweis löschen */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--nav); color: var(--nav-fg); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.28); max-width: calc(100% - 32px); z-index: 10; }
.toast button { border: 0; background: transparent; color: #7DB8FF; font-weight: 600; padding: 2px 4px; }

@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .period .nav { margin-left: 0; }
  .crow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .crow .chk { grid-column: 1; }
  .crow .del { grid-column: 2; justify-self: end; }
}
@media (pointer: coarse) {
  .btn, .ghost, .add { min-height: 44px; }
  .seg button { min-height: 38px; }
  .x { width: 40px; height: 40px; }
  .sw { width: 36px; height: 36px; }
  .cname, .cname-btn, .datebtn { min-height: 40px; }
}
@media (max-width: 560px) {
  .top { padding-block: 8px; }
  .top-in { gap: 8px 10px; flex-wrap: nowrap; }
  .bt, .lbl, .sync { display: none; }
  .brand { margin-right: 0; }
  .top-rest { margin-left: auto; }
  .period h1 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 5.5 L16 13 L13 20.5 L10 13 Z" fill="currentColor"/></svg>
      <span class="bt">Auftragskompass</span>
    </div>
    <div class="seg" role="group" aria-label="Ansicht">
      <button id="m-week" type="button" data-act="mode" data-mode="week" aria-pressed="true">Woche</button>
      <button id="m-month" type="button" data-act="mode" data-mode="month" aria-pressed="false">Monat</button>
    </div>
    <span class="sync" id="sync" role="status"></span>
    <span class="top-rest num" id="top-rest"></span>
    <button class="ghost" id="btn-settings" type="button" data-act="settings" aria-expanded="false" aria-label="Einstellungen">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h7M13 4h1M2 12h1M7 12h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="11" cy="4" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="5" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <span class="lbl">Einstellungen</span>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="period" aria-label="Zeitraum">
    <h1 id="p-title"></h1>
    <span class="range" id="p-range"></span>
    <div class="nav">
      <button class="btn sq" type="button" data-act="prev" aria-label="Zurück"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn" type="button" data-act="today" id="btn-today">Heute</button>
      <button class="btn sq" type="button" data-act="next" aria-label="Weiter"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m5 2 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </section>

  <div class="hint" id="example-hint" hidden>
    <p><b>Beispieldaten.</b> Fixkosten, Kundennamen und Preise sind Platzhalter. Trage deine eigenen Werte in den Einstellungen ein.</p>
    <button class="btn" type="button" data-act="settings-open">Werte eintragen</button>
  </div>

  <div class="hint" id="signin-hint" hidden>
    <p><b>Nicht angemeldet.</b> Melde dich an, damit sich deine Daten zwischen Mac und Pixel abgleichen.</p>
    <button class="btn" type="button" data-act="signin">Mit Google anmelden</button>
  </div>

  <section class="panel" id="settings" hidden aria-label="Einstellungen"></section>

  <section class="hero" id="hero" aria-live="polite"></section>

  <section class="board" aria-label="Aufträge">
    <div class="cols" id="cols"></div>
    <section class="col" id="free-col" style="--c:#6B7A90;--ink:#FFFFFF">
      <div class="col-h"><h2>Sonstige Projekte</h2><span class="count num" id="free-count">0</span></div>
      <p class="col-sum num" id="free-sum"></p>
      <form class="free-form" id="free-form" autocomplete="off">
        <div class="field"><label for="fr-label">Projekt (optional)</label><input id="fr-label" type="text" placeholder="z. B. Imagefilm Schnitt" maxlength="60"></div>
        <div class="field"><label for="fr-amt">Summe vor Steuer</label><div class="suffix" data-s="€"><input id="fr-amt" class="num" type="text" inputmode="decimal" placeholder="0" required></div></div>
        <p class="preview num" id="fr-prev"></p>
        <button class="add" type="submit"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Projekt hinzufügen</button>
      </form>
      <ul class="cards" id="free-list"></ul>
    </section>
  </section>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script src="firebase-config.js"></script>
<script>
/*CORE*/
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const startOfWeek = d => addDays(d, -((d.getDay() + 6) % 7));
const round2 = x => Math.round(x * 100) / 100;
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dn);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
function periodRange(mode, anchor) {
  if (mode === 'week') { const a = startOfWeek(anchor); return [a, addDays(a, 6)]; }
  return [new Date(anchor.getFullYear(), anchor.getMonth(), 1), new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0)];
}
const netOfGross = (st, gross) => round2(gross * (1 - st.tax / 100));
const clientNet = (st, c) => round2(c.price * (c.taxed ? 1 - st.tax / 100 : 1));
function calc(st, mode, anchor, today) {
  const [a, b] = periodRange(mode, anchor);
  const sa = ymd(a), sb = ymd(b);
  const es = st.entries.filter(e => e.date >= sa && e.date <= sb);
  const net = round2(es.reduce((s, e) => s + e.net, 0));
  const target = mode === 'month' ? st.fix : round2(st.fix * 12 / 52);
  const rest = Math.max(0, round2(target - net));
  const over = Math.max(0, round2(net - target));
  const pct = target > 0 ? Math.min(100, net / target * 100) : 100;
  const needs = st.clients.map(c => {
    const cn = clientNet(st, c);
    return { id: c.id, name: c.name, net: cn, n: cn > 0 ? Math.ceil(rest / cn - 1e-9) : 0 };
  });
  const fr = st.entries.filter(e => e.kind === 'free');
  const freeAvg = fr.length ? round2(fr.reduce((s, e) => s + e.net, 0) / fr.length) : 0;
  const freeNeed = freeAvg > 0 ? Math.ceil(rest / freeAvg - 1e-9) : 0;
  let weeksLeft = 0, perWeek = 0;
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if (mode === 'month' && t0 >= a && t0 <= b) {
    weeksLeft = Math.max(1, Math.ceil((Math.round((b - t0) / 864e5) + 1) / 7));
    perWeek = round2(rest / weeksLeft);
  }
  return { a, b, es, net, target, rest, over, pct, needs, freeAvg, freeNeed, freeN: fr.length, weeksLeft, perWeek };
}
/*ENDCORE*/

(function () {
  const LS_KEY = 'auftragskompass:v1';
  const LS_VIEW = 'auftragskompass:view';
  const PALETTE = ['#2F80ED', '#8B5CF6', '#F2603A', '#18A874', '#E0409A', '#E9B20C', '#0FA5C4', '#7A8699'];
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const inkOf = hex => { const n = parseInt(hex.slice(1), 16); const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255); return 1.05 / (L + 0.05) >= (L + 0.05) / 0.0655 ? '#FFFFFF' : '#14213A'; };
  const $ = id => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 9);

  function editName(btn) {
    const id = btn.dataset.id;
    const e = state.entries.find(x => x.id === id); if (!e) return;
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'cname'; inp.maxLength = 60; inp.value = e.label;
    inp.placeholder = e.kind === 'client' ? 'Auftrag' : 'Projekt';
    inp.setAttribute('aria-label', 'Name');
    btn.replaceWith(inp);
    inp.focus(); inp.select();
    let done = false;
    const finish = keep => {
      if (done) return; done = true;
      if (keep) { e.label = inp.value.trim().slice(0, 60); touchMonth(e.date); save(); }
      renderAll(true);
    };
    inp.addEventListener('blur', () => finish(true));
    inp.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
    });
  }
  document.addEventListener('click', ev => {
    const t = ev.target;
    if (t.classList && t.classList.contains('date-hid') && t.showPicker) { try { t.showPicker(); } catch (err) {} }
  });

  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    if (act === 'mode') {
      mode = b.dataset.mode;
      try { localStorage.setItem(LS_VIEW, mode); } catch (e) {}
      renderAll(true);
    }
    else if (act === 'prev') shift(-1);
    else if (act === 'next') shift(1);
    else if (act === 'today') { const t = new Date(); anchor = new Date(t.getFullYear(), t.getMonth(), t.getDate()); renderAll(true); }
    else if (act === 'settings') toggleSettings();
    else if (act === 'settings-open') toggleSettings(true);
    else if (act === 'edit-name') editName(b);
    else if (act === 'add') addClientEntry(id);
    else if (act === 'del') delEntry(id);
    else if (act === 'undo') undo();
    else if (act === 'cadd') {
      const used = state.clients.map(c => c.color);
      const free = PALETTE.find(col => used.indexOf(col) < 0) || PALETTE[state.clients.length % PALETTE.length];
      state.clients.push({ id: 'c' + uid(), name: 'Neuer Kunde', price: 300, taxed: false, color: free });
      dirtySettings = true; save(); renderAll();
      const last = state.clients[state.clients.length - 1];
      const inp = $('cn-' + last.id); if (inp) { inp.focus(); inp.select(); }
    }
    else if (act === 'signin') signIn();
    else if (act === 'signout') signOutNow();
    else if (act === 'ccolor') {
      const c = state.clients.find(x => x.id === id);
      if (c) { c.color = b.dataset.color; dirtySettings = true; save(); renderAll(); }
    }
    else if (act === 'cdel') {
      const c = state.clients.find(x => x.id === id); if (!c) return;
      state.entries.forEach(e => { if (e.clientId === id) { e.kind = 'free'; e.clientId = ''; e.label = e.label || c.name; touchMonth(e.date); } });
      state.clients = state.clients.filter(x => x.id !== id);
      dirtySettings = true; save(); renderAll();
      showToast('Kunde entfernt. Seine Aufträge stehen unter Sonstige Projekte.', false);
    }
    else if (act === 'clear-example') {
      state.entries.forEach(e => touchMonth(e.date));
      state.entries = []; state.example = false;
      dirtySettings = true; save(); renderAll();
    }
  });
  document.addEventListener('change', ev => {
    const t = ev.target, f = t.dataset && t.dataset.f; if (!f) return;
    const id = t.dataset.id;
    if (f === 'fix') { const v = parseNum(t.value); if (v >= 0) state.fix = v; t.value = numStr(state.fix); dirtySettings = true; }
    else if (f === 'tax') { const v = parseNum(t.value); if (v >= 0 && v < 100) state.tax = v; t.value = numStr(state.tax); dirtySettings = true; }
    else if (f === 'cname') { const c = state.clients.find(x => x.id === id); if (c) { c.name = t.value.trim() || 'Kunde'; t.value = c.name; dirtySettings = true; } }
    else if (f === 'cprice') { const c = state.clients.find(x => x.id === id); const v = parseNum(t.value); if (c && v >= 0) { c.price = round2(v); dirtySettings = true; } if (c) t.value = numStr(c.price); }
    else if (f === 'ctax') { const c = state.clients.find(x => x.id === id); if (c) { c.taxed = t.checked; dirtySettings = true; } }
    else if (f === 'elabel') {
      const e = state.entries.find(x => x.id === id);
      if (e) { e.label = t.value.trim().slice(0, 60); touchMonth(e.date); save(); }
      return;
    }
    else if (f === 'edate') {
      const e = state.entries.find(x => x.id === id);
      if (e && /^\d{4}-\d{2}-\d{2}$/.test(t.value)) { touchMonth(e.date); e.date = t.value; touchMonth(e.date); }
      else if (e) { t.value = e.date; return; }
    }
    save();
    renderAll(f !== 'tax');
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('cl-name')) { ev.preventDefault(); addClientEntry(ev.target.dataset.id); }
  });
  $('free-form').addEventListener('submit', addFree);
  $('fr-amt').addEventListener('input', updatePreview);

  renderAll();
  updateStatus();
  startCloud();
  registerSW();
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);
})();
</script>
</body>
</html>
